services:
  emr-db:
    image: postgres:16
    container_name: emrbridge-emr-db
    environment:
      POSTGRES_DB: emrbridge
      POSTGRES_USER: emrbridge
      POSTGRES_PASSWORD: emrbridge
    ports:
      - "5432:5432"
    volumes:
      - emr-db-data:/var/lib/postgresql/data

  fhir-db:
    image: postgres:16
    container_name: emrbridge-fhir-db
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: hapi
      POSTGRES_PASSWORD: hapi
    ports:
      - "5433:5432"
    volumes:
      - fhir-db-data:/var/lib/postgresql/data
    healthcheck: # 이게 없으면 HAPI가 DB 뜨기 전에 연결 시도
      test: [ "CMD-SHELL", "pg_isready -U hapi" ]
      interval: 5s
      timeout: 5s
      retries: 10

  analytics-db:
    image: postgres:16
    container_name: emrbridge-analytics-db
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
    ports:
      - "5434:5432"
    volumes:
      - analytics-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U analytics" ]
      interval: 5s
      timeout: 5s
      retries: 10

  hapi-fhir:
    image: hapiproject/hapi:v8.2.0-1
    container_name: emrbridge-hapi-fhir
    depends_on:
      fhir-db:
        condition: service_healthy   # DB 완전히 뜰 때까지 대기
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://fhir-db:5432/hapi
      SPRING_DATASOURCE_USERNAME: hapi
      SPRING_DATASOURCE_PASSWORD: hapi
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      HAPI_FHIR_FHIR_VERSION: R4
      HAPI_FHIR_ALLOW_EXTERNAL_REFERENCES: "true"
      HAPI_FHIR_REUSE_CACHED_SEARCH_RESULTS_MILLIS: "60000"

  frontend:
    build:
      context: ./frontend
    container_name: emrbridge-frontend
    ports:
      - "8082:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  emr-db-data:
  fhir-db-data:
  analytics-db-data: