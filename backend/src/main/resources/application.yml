server:
  port: 8080

spring:
  application:
    name: emrbridge-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/emrbridge
    username: emrbridge
    password: emrbridge
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration  # 마이그레이션 SQL 파일 경로
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  batch:
    job:
      enabled: false              # ? ?? ? ?? ?? ??
    jdbc:
      initialize-schema: always   # Batch ?? ??? ?? ??

csv:
  import:
    path: src/main/resources/csv  # Synthea CSV ??

fhir:
  server:
    url: http://localhost:8081/fhir