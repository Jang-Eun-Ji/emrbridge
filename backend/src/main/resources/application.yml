server:
  port: 8080

spring:
  application:
    name: emrbridge-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/emrbridge
    username: emrbridge
    password: emrbridge
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true

  batch:
    job:
      enabled: false

fhir:
  server:
    url: http://localhost:8081/fhir