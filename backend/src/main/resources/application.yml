server:
  port: 8080

spring:
  application:
    name: emrbridge-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/emrbridge
    username: emrbridge
    password: emrbridge
    driver-class-name: org.postgresql.Driver

  # EMR DB Flyway - 자동 실행 비활성화 (수동으로 관리)
  flyway:
    enabled: false

  # Analytics DB (별도 DataSource)
  analytics-db:
    datasource:
      url: jdbc:postgresql://localhost:5434/analytics
      username: analytics
      password: analytics
      driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      jdbc:
        batch_size: 1000
        order_inserts: true
        order_updates: true
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

csv:
  import:
    path: csv  # Synthea CSV

fhir:
  server:
    url: http://localhost:8081/fhir