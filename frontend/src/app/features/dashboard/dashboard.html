<section class="page">
  <header class="page-header">
    <p class="eyebrow">Dashboard</p>
    <h1>의료 데이터 통계</h1>
    <p>Analytics DB의 방문, 환자, 질병, 지역 집계입니다.</p>
  </header>

  @if (state(); as current) {
    @if (current.status === 'loading') {
      <mat-progress-bar mode="indeterminate" />
    }
    @if (current.status === 'error') {
      <app-load-error [statusCode]="current.statusCode" endpoint="GET /api/analytics/dashboard" />
    }
  }

  <div class="kpis">
    @for (item of kpis(); track item.label) {
      <article>
        <span>{{ item.label }}</span>
        <strong>{{ item.value }}</strong>
      </article>
    }
  </div>

  @if (state().status === 'ready') {
    <div class="charts">
      <app-chart-panel title="월별 방문" [options]="monthlyChart()" />
      <app-chart-panel title="연령 · 성별" [options]="demographicChart()" />
      <app-chart-panel title="방문이 많은 질병" [options]="diseaseChart()" />
      <app-chart-panel title="지역별 방문" [options]="regionChart()" />
    </div>
  }
</section>
